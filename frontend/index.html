<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VegRecipes — Frontend</title>

  <!-- Bootstrap 5 CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <!-- Google Fonts + CSS próprio -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container">
      <h1>🥦 VegRecipes</h1>
      <p class="subtitle">Receitas vegetarianas · API REST + Vanilla JS</p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container py-4">

    <!-- TABS -->
    <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-receitas">
          🍽 Receitas
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-categorias">
          🏷 Categorias
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-autores">
          ✍ Autores
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ═══ TAB RECEITAS ═══ -->
      <div class="tab-pane fade show active" id="tab-receitas">
        <div class="row g-4">

          <!-- Formulário Nova Receita -->
          <div class="col-lg-5">
            <div class="section-card">
              <h2 class="section-title">➕ Nova Receita</h2>
              <form id="form-receita" novalidate>

                <div class="mb-3">
                  <label class="form-label" for="rec-nome">Nome da receita *</label>
                  <input type="text" id="rec-nome" class="form-control" placeholder="Ex: Risoto de cogumelos" required />
                </div>

                <div class="mb-3">
                  <label class="form-label" for="rec-modo">Modo de preparo *</label>
                  <textarea id="rec-modo" class="form-control" placeholder="Descreva o passo a passo…" required></textarea>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col">
                    <label class="form-label" for="rec-tempo">Tempo (min) *</label>
                    <input type="number" id="rec-tempo" class="form-control" placeholder="30" min="1" required />
                  </div>
                  <div class="col">
                    <label class="form-label" for="rec-porcoes">Porções *</label>
                    <input type="number" id="rec-porcoes" class="form-control" placeholder="4" min="1" required />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="rec-categoria">Categoria *</label>
                  <select id="rec-categoria" class="form-select" required>
                    <option value="">— Selecione —</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="rec-autor">Autor (opcional)</label>
                  <select id="rec-autor" class="form-select">
                    <option value="">— Nenhum —</option>
                  </select>
                </div>

                <!-- Ingredientes -->
                <div class="mb-3">
                  <label class="form-label">Ingredientes</label>
                  <div class="ing-row">
                    <input type="text" id="ing-nome" class="form-control" placeholder="Ingrediente" />
                    <input type="number" id="ing-qtd" class="form-control" placeholder="Qtd" style="max-width:70px" min="0" step="any" />
                    <input type="text" id="ing-un" class="form-control" placeholder="Unidade" style="max-width:90px" />
                    <button type="button" id="btn-add-ing" class="btn-secondary-veg">+ Add</button>
                  </div>
                  <div id="ing-list"></div>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn-primary-veg">
                    Criar Receita
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Lista de Receitas -->
          <div class="col-lg-7">
            <div class="section-card">
              <h2 class="section-title">📋 Receitas Cadastradas</h2>
              <div id="receitas-list">
                <p class="text-center text-muted fst-italic py-4">Carregando…</p>
              </div>
            </div>
          </div>

        </div>
      </div><!-- /tab-receitas -->

      <!-- ═══ TAB CATEGORIAS ═══ -->
      <div class="tab-pane fade" id="tab-categorias">
        <div class="row g-4">

          <!-- Formulário -->
          <div class="col-md-4">
            <div class="section-card">
              <h2 class="section-title">➕ Nova Categoria</h2>
              <form id="form-categoria" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="cat-nome">Nome *</label>
                  <input type="text" id="cat-nome" class="form-control" placeholder="Ex: Sobremesas" required />
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn-primary-veg">Criar</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Tabela -->
          <div class="col-md-8">
            <div class="section-card">
              <h2 class="section-title">🏷 Categorias</h2>
              <table>
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="categorias-tbody">
                  <tr><td colspan="2" class="text-center text-muted py-3">Carregando…</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div><!-- /tab-categorias -->

      <!-- ═══ TAB AUTORES ═══ -->
      <div class="tab-pane fade" id="tab-autores">
        <div class="row g-4">

          <!-- Formulário -->
          <div class="col-md-4">
            <div class="section-card">
              <h2 class="section-title">➕ Novo Autor</h2>
              <form id="form-autor" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="autor-nome">Nome *</label>
                  <input type="text" id="autor-nome" class="form-control" placeholder="Ex: Maria Silva" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="autor-email">E-mail *</label>
                  <input type="email" id="autor-email" class="form-control" placeholder="maria@email.com" required />
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn-primary-veg">Cadastrar</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Tabela -->
          <div class="col-md-8">
            <div class="section-card">
              <h2 class="section-title">✍ Autores</h2>
              <table>
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="autores-tbody">
                  <tr><td colspan="3" class="text-center text-muted py-3">Carregando…</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div><!-- /tab-autores -->

    </div><!-- /tab-content -->
  </main>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App entry point (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
